[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gdvideo"
version = "0.1.0"
description = "Turn a Geometry Dash recording session into a YouTube video and a 9:16 video with bilingual subtitles"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic==2.3.0",
    "mlx-whisper==0.4.3",
    "numpy==2.5.4",
    "pillow==13.0.0",
    "scipy==1.18.1",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
gdvideo = "gdvideo.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
